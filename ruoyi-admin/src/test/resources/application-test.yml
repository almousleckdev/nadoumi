# Overrides for the Testcontainers-backed integration tests. DB + Redis coordinates
# are injected by @DynamicPropertySource; everything here is static test tuning.
spring:
  devtools:
    restart:
      enabled: false
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    com.ruoyi: warn
    com.nadoumi: info
    org.springframework: warn

ruoyi:
  profile: ${java.io.tmpdir}/nadoumi-test-upload
