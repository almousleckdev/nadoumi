# Overrides for the Testcontainers-backed integration tests. DB + Redis coordinates
# are injected by @DynamicPropertySource; everything here is static test tuning.
spring:
  devtools:
    restart:
      enabled: false
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    com.ruoyi: warn
    com.nadoumi: info
    org.springframework: warn

ruoyi:
  profile: ${java.io.tmpdir}/nadoumi-test-upload

# Tests never set a real TOKEN_SECRET; explicitly allow the in-repo dev default
# here rather than relying on it silently everywhere (see TokenService).
token:
  dev-secret-allowed: true

nadoumi:
  mail:
    # OtpEndToEndTest reads the captured code via GET /api/dev/mail/latest.
    # Off by default everywhere else; see DevMailController.
    dev-inbox:
      enabled: true
