# datasource
spring:
    # Per-developer overrides. This import lives in the profile-active file so the
    # values below can actually be overridden (a file imported from application.yml
    # is out-ranked by this profile file). Tried from the repo root and the module dir.
    config:
        import:
            - optional:file:./config/application-local.yml
            - optional:file:../config/application-local.yml
            - optional:file:../../config/application-local.yml
    datasource:
        type: com.alibaba.druid.pool.DruidDataSource
        driverClassName: com.mysql.cj.jdbc.Driver
        druid:
            # master datasource (externalize via SPRING_DATASOURCE_DRUID_MASTER_{URL,USERNAME,PASSWORD})
            master:
                url: ${SPRING_DATASOURCE_DRUID_MASTER_URL:jdbc:mysql://localhost:3306/ry-vue?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT%2B8}
                username: ${SPRING_DATASOURCE_DRUID_MASTER_USERNAME:root}
                # empty default so a passwordless local MySQL works with no extra config;
                # every real environment sets SPRING_DATASOURCE_DRUID_MASTER_PASSWORD.
                password: ${SPRING_DATASOURCE_DRUID_MASTER_PASSWORD:}
            # slave datasource
            slave:
                # slave toggle (default off)
                enabled: false
                url: 
                username: 
                password: 
            # initial pool size
            initialSize: 5
            # min idle
            minIdle: 10
            # max active
            maxActive: 20
            # max wait for a connection (ms)
            maxWait: 60000
            # connect timeout (ms)
            connectTimeout: 30000
            # socket timeout (ms)
            socketTimeout: 60000
            # eviction run interval (ms)
            timeBetweenEvictionRunsMillis: 60000
            # min idle time before eviction (ms)
            minEvictableIdleTimeMillis: 300000
            # max idle time before eviction (ms)
            maxEvictableIdleTimeMillis: 900000
            # validation query
            validationQuery: SELECT 1 FROM DUAL
            testWhileIdle: true
            testOnBorrow: false
            testOnReturn: false
            webStatFilter: 
                enabled: true
            statViewServlet:
                # OFF by default; opt in locally with DRUID_STAT_VIEW_ENABLED=true.
                # Never enable in a shared/prod environment (see docs/DEPLOYMENT.md §3).
                enabled: ${DRUID_STAT_VIEW_ENABLED:false}
                # allow-list; empty = allow all. Loopback-only unless widened.
                allow: ${DRUID_STAT_VIEW_ALLOW:127.0.0.1}
                url-pattern: /druid/*
                # console credentials — must be overridden wherever the servlet is enabled
                login-username: ${DRUID_CONSOLE_USERNAME:ruoyi}
                login-password: ${DRUID_CONSOLE_PASSWORD:123456}
            filter:
                stat:
                    enabled: true
                    # log slow SQL
                    log-slow-sql: true
                    slow-sql-millis: 1000
                    merge-sql: true
                wall:
                    config:
                        # no stacked ';'-delimited statements (no mapper relies on them)
                        multi-statement-allow: false