# Application settings
ruoyi:
  name: Nadoumi
  version: 3.9.2
  copyrightYear: 2026
  # Upload directory. Override with RUOYI_PROFILE in every real environment.
  profile: ${RUOYI_PROFILE:${user.home}/nadoumi/upload}
  # resolve a geographic location for the request IP
  addressEnabled: false
  # captcha type: math (arithmetic) | char (characters)
  captchaType: math

server:
  # HTTP port
  port: 8080
  servlet:
    context-path: /
  tomcat:
    uri-encoding: UTF-8
    # accept queue length once all connections are busy
    accept-count: 1000
    threads:
      max: 800
      min-spare: 100

logging:
  level:
    com.ruoyi: debug
    com.nadoumi: debug
    org.springframework: warn

user:
  password:
    # max failed login attempts before lockout
    maxRetryCount: 5
    # lockout duration in minutes
    lockTime: 10

spring:
  # optional per-developer overrides in config/application-local.yml (git-ignored);
  # real env config comes from env vars. Both paths are tried so it loads whether the
  # process starts from the repo root or from the ruoyi-admin/ module directory.
  config:
    import:
      - optional:file:./config/application-local.yml
      - optional:file:../config/application-local.yml
      - optional:file:../../config/application-local.yml
  # messages
  messages:
    # i18n bundle base name
    basename: i18n/messages
  profiles:
    active: druid
  # multipart upload — hard ceiling for media uploads (spec §I.10, nadoumi-media)
  servlet:
    multipart:
      # per-file limit
      max-file-size: 20MB
      # total request limit
      max-request-size: 22MB
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  # devtools
  devtools:
    restart:
      # hot reload
      enabled: true
  # Database migration (D14). V1 = the RuoYi + Quartz baseline: recorded (not executed) on
  # existing databases, executed only on a fresh/empty one. Nadoumi schema from V3.
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: "RuoYi + Quartz baseline schema"
    validate-on-migrate: true
    clean-disabled: true
  # persist jobs to the existing QRTZ_* tables (clustered JDBC job store)
  quartz:
    job-store-type: jdbc
    overwrite-existing-jobs: true
    jdbc:
      initialize-schema: never
    properties:
      org.quartz.scheduler.instanceName: NadoumiScheduler
      org.quartz.scheduler.instanceId: AUTO
      org.quartz.jobStore.class: org.springframework.scheduling.quartz.LocalDataSourceJobStore
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.StdJDBCDelegate
      org.quartz.jobStore.tablePrefix: QRTZ_
      org.quartz.jobStore.isClustered: true
      org.quartz.jobStore.clusterCheckinInterval: 15000
      org.quartz.jobStore.misfireThreshold: 60000
      org.quartz.threadPool.class: org.quartz.simpl.SimpleThreadPool
      org.quartz.threadPool.threadCount: 20
      org.quartz.threadPool.threadPriority: 5
  data:
    # redis
    redis:
      # host
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      # port
      port: ${SPRING_DATA_REDIS_PORT:6379}
      # database index
      database: ${SPRING_DATA_REDIS_DATABASE:0}
      # password (externalize via SPRING_DATA_REDIS_PASSWORD; required in non-local envs)
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      # TLS (enable via SPRING_DATA_REDIS_SSL_ENABLED=true in non-local envs)
      ssl:
        enabled: ${SPRING_DATA_REDIS_SSL_ENABLED:false}
      # connection timeout
      timeout: 10s
      lettuce:
        pool:
          # min idle connections
          min-idle: 0
          # max idle connections
          max-idle: 8
          # max active connections
          max-active: 8
          # max blocking wait (negative = unlimited)
          max-wait: -1ms
  # outbound email (spec Revision 2 §15). Only used when nadoumi.mail.transport=smtp.
  # Dev: Mailpit from docker-compose.yml (localhost:1025, no auth). Staging/prod:
  # Gmail (smtp.gmail.com:587 + App Password) or any SMTP — env only, no code change.
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${SPRING_MAIL_SMTP_STARTTLS:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# Nadoumi-specific configuration
nadoumi:
  mail:
    # log  = write rendered mails to logFile (no network); smtp = send via spring.mail.* above
    transport: ${NADOUMI_MAIL_TRANSPORT:log}
    from: ${NADOUMI_MAIL_FROM:no-reply@nadoumi.local}
    logFile: ${NADOUMI_MAIL_LOG_FILE:./mail-outbox.log}
    # Anonymous GET /api/dev/mail/latest — reads raw OTP / reset codes for E2E.
    # Explicit opt-in, OFF unless set true, and never mounted under the prod profile.
    # Do not enable outside local dev / CI.
    dev-inbox:
      enabled: ${NADOUMI_MAIL_DEV_INBOX_ENABLED:false}
    # where public "Contact us" submissions are forwarded
    supportInbox: ${NADOUMI_MAIL_SUPPORT_INBOX:support@nadoumi.local}
  web:
    # used in transactional emails (e.g. the "account already exists" message)
    loginUrl: ${NADOUMI_WEB_LOGIN_URL:http://localhost:3000/login}
    # public site origin — builds CTA links and hosts /email/* assets. No trailing slash.
    # Emails need absolute, reachable URLs, so this defaults to the live site.
    baseUrl: ${NADOUMI_WEB_BASE_URL:https://nadoumi.com}
  # brand + contact block rendered into every transactional email (EmailLayout).
  # Keep contact.* in sync with nadoumi-web/app/data/contact.ts until a shared API exists.
  brand:
    # public site origin — builds CTA/content links (e.g. "View scholarships").
    # Reuses the same origin as nadoumi.web.baseUrl above. Without this,
    # BrandProperties falls back to its localhost default and every link in a
    # real inbox is unreachable.
    baseUrl: ${NADOUMI_WEB_BASE_URL:https://nadoumi.com}
    # THIS backend's own public origin — serves /email/* (logo, social icons).
    # Deliberately separate from baseUrl above: nadoumi-web (the public site)
    # and this API are different deployments, so the logo/icon <img> src must
    # resolve on this API's own origin, not the site's, or every image in a
    # real inbox 404s even though this backend serves the files correctly.
    assetBaseUrl: ${NADOUMI_BRAND_ASSET_BASE_URL:https://api.nadoumi.com}
    wordmark: ${NADOUMI_BRAND_WORDMARK:Nadoumi}
    logoPath: ${NADOUMI_BRAND_LOGO_PATH:/email/nadoumi-logo.png}
    preferencesPath: ${NADOUMI_BRAND_PREFERENCES_PATH:/account/notifications}
    contact:
      emails: ${NADOUMI_BRAND_EMAILS:support@nadoumi.com}
      phones: ${NADOUMI_BRAND_PHONES:+86 159 0823 7607}
      officeEn: ${NADOUMI_BRAND_OFFICE:Room 02, Floor 8, Unit 1, Building 6, Jiuzhou Beijun, No. 2 Fuxi Road, Fucheng District, Mianyang, Sichuan, China}
      hours: ${NADOUMI_BRAND_HOURS:Monday to Friday, 09:00-18:00 (China Standard Time, UTC+8)}
    # blank -> that social icon is omitted from the footer
    social:
      facebook: ${NADOUMI_SOCIAL_FACEBOOK:}
      instagram: ${NADOUMI_SOCIAL_INSTAGRAM:}
      tiktok: "${NADOUMI_SOCIAL_TIKTOK:https://www.tiktok.com/@nadoumi.consultin?_r=1&_t=ZS-99dx3mbqoQG}"
      whatsapp: "${NADOUMI_SOCIAL_WHATSAPP:https://wa.me/message/OZJAF4R5J5U6A1}"
  media:
    # Cloudinary folder prefix so one cloud can host all envs without collision
    env: ${NADOUMI_MEDIA_ENV:dev}
    # signed-URL lifetime for PROTECTED assets; clamped to [60, 600] in code
    signed-url-ttl-seconds: ${NADOUMI_MEDIA_SIGNED_URL_TTL_SECONDS:180}
    # hard upload ceiling across all categories; mirrors spring.servlet.multipart
    max-upload-mb: ${NADOUMI_MEDIA_MAX_UPLOAD_MB:20}
    # grace period before the reconciliation job destroys a DELETED asset (Part I, Task 12)
    reconcile-grace-days: ${NADOUMI_MEDIA_RECONCILE_GRACE_DAYS:30}

# token
token:
  # header carrying the token
  header: ${TOKEN_HEADER:Authorization}
  # token secret — DEV DEFAULT ONLY (90 chars). MUST be overridden via TOKEN_SECRET in every
  # real environment. HS512 requires >= 64 bytes.
  secret: ${TOKEN_SECRET:ZGV2LW9ubHktZG8tbm90LXVzZS1pbi1wcm9kLW5hZG91bWktcnVveWktaHM1MTItamp3dC1zZWNyZXQtMDAxMjM0NQ}
  # JWT "kid" header — enables future key rotation
  kid: ${TOKEN_KID:v1}
  # token lifetime in minutes
  expireTime: ${TOKEN_EXPIRE_TIME:30}

# MyBatis
mybatis:
  # type-alias packages
  typeAliasesPackage: com.ruoyi.**.domain
  # mapper XML locations
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # global MyBatis config
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Springdoc / OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
  group-configs:
    - group: 'default'
      display-name: 'Default module'
      paths-to-match: '/**'
      packages-to-scan: com.ruoyi.web.controller,com.nadoumi

# referer check
referer:
  # enable referer check
  enabled: false
  # allowed domains
  allowed-domains: localhost,127.0.0.1

# XSS filter
xss:
  # enable
  enabled: true
  # excluded paths (comma-separated)
  excludes: /system/notice
  # matched paths
  urlPatterns: /system/*,/monitor/*,/tool/*

# Actuator — runs on the main port, under the existing Spring Security filter chain.
# /actuator/health/** is permitted for liveness/readiness probes (no details);
# info / metrics / prometheus require an authenticated request.
# Production: front with a private network / scrape credential — see docs/DEPLOYMENT.md §3.
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics,prometheus
    health:
      # mail-server reachability must not gate the app's health — the transport
      # is chosen by nadoumi.mail.transport and a slow/refusing SMTP host would
      # otherwise flap the readiness probe. Re-enable per-env if you want it.
      mail:
        enabled: false
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
      show-components: when_authorized
      group:
        # what "ready to serve traffic" actually means here: DB + Redis reachable.
        readiness:
          include: readinessState,db,redis
  info:
    env:
      enabled: false
