name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # ubuntu-latest ships a running Docker daemon, so the Testcontainers-based
      # integration tests execute here (they self-skip where Docker is absent).
      - name: Build & verify
        run: mvn -B -ntp clean verify

      - name: Upload boot jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ruoyi-admin
          path: ruoyi-admin/target/ruoyi-admin.jar
          if-no-files-found: error
          retention-days: 7

  nadoumi-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: nadoumi-web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: nadoumi-web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build

  nadoumi-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: nadoumi-admin
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: nadoumi-admin/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
